<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>班级作业</title>

<style>
* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;

  background:
    radial-gradient(circle at 20% 20%, rgba(120, 170, 255, .28), transparent 32%),
    radial-gradient(circle at 80% 30%, rgba(190, 120, 255, .25), transparent 30%),
    radial-gradient(circle at 50% 90%, rgba(80, 210, 190, .18), transparent 35%),
    #f4f7ff;

  color: #202331;
  transition: background .4s ease, color .4s ease;
  overflow-x: hidden;
}

/* 深色模式 */
@media (prefers-color-scheme: dark) {
  body {
    background:
      radial-gradient(circle at 20% 20%, rgba(80, 130, 255, .22), transparent 32%),
      radial-gradient(circle at 80% 30%, rgba(170, 90, 255, .20), transparent 30%),
      radial-gradient(circle at 50% 90%, rgba(40, 190, 170, .13), transparent 35%),
      #0d1018;

    color: #f2f4ff;
  }

  .card {
    background: rgba(25, 29, 42, .68);
    border-color: rgba(255,255,255,.10);
  }

  .date {
    color: #b9bfd4;
  }

  .hint {
    color: #969db5;
  }
}

/* Aurora 光晕 */
.aurora {
  position: fixed;
  width: 420px;
  height: 420px;
  border-radius: 50%;
  filter: blur(90px);
  opacity: .25;
  pointer-events: none;
  z-index: -1;

  left: 50%;
  top: 35%;
  transform:
    translate(
      calc(-50% + var(--move-x, 0px)),
      calc(-50% + var(--move-y, 0px))
    );

  transition: transform .8s ease-out;
}

/* 主容器 */
.container {
  width: min(92%, 760px);
  margin: 0 auto;
  padding: 70px 0 80px;
}

/* 标题 */
header {
  text-align: center;
  margin-bottom: 28px;
}

h1 {
  margin: 0;
  font-size: clamp(38px, 8vw, 64px);
  font-weight: 800;
  letter-spacing: -2px;

  background: linear-gradient(
    120deg,
    #5b7cff,
    #a45cff,
    #e55cff
  );

  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

/* Emoji 不跟随文字渐变 */
.book-icon {
  color: initial;
  -webkit-text-fill-color: initial;
  background: none;
  -webkit-background-clip: initial;
  background-clip: initial;
}

.subtitle {
  margin-top: 10px;
  font-size: 15px;
  opacity: .65;
}

/* 卡片 */
.card {
  border-radius: 28px;
  padding: 22px;

  background: rgba(255,255,255,.64);
  border: 1px solid rgba(255,255,255,.65);

  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);

  box-shadow:
    0 20px 60px rgba(50,60,100,.12);

  transition:
    transform .3s ease,
    box-shadow .3s ease;
}

.card:hover {
  transform: translateY(-3px);

  box-shadow:
    0 25px 70px rgba(50,60,100,.18);
}

/* 日期 */
.date {
  text-align: center;
  margin: 4px 0 20px;

  font-size: 17px;
  font-weight: 600;

  color: #626a82;
}

/* 图片 */
.image-wrapper {
  overflow: hidden;
  border-radius: 20px;

  background: rgba(0,0,0,.04);

  cursor: zoom-in;
}

#homeworkImage {
  display: block;
  width: 100%;
  height: auto;

  min-height: 120px;

  object-fit: contain;

  transition: transform .35s ease;
}

#homeworkImage:hover {
  transform: scale(1.015);
}

/* 提示 */
.hint {
  margin-top: 18px;
  text-align: center;

  font-size: 13px;
  color: #7c8397;
}

/* 页脚 */
footer {
  margin-top: 30px;
  text-align: center;

  font-size: 12px;
  opacity: .5;
}
</style>
</head>

<body>

<div class="aurora" id="aurora"></div>

<main class="container">

  <header>
    <h1>
      <span class="book-icon">📚</span>
      班级作业
    </h1>

    <div class="subtitle">
      每周作业 · 一张图看完
    </div>
  </header>

  <section class="card">

    <div class="date" id="date">
      正在获取作业日期……
    </div>

    <div class="image-wrapper">
      <img
        id="homeworkImage"
        src="https://raw.githubusercontent.com/cheems201/class-homework/main/homework.jpg"
        alt="本周作业"
      >
    </div>

    <div class="hint">
      点击图片可查看原图
    </div>

  </section>

  <footer>
    班级作业分享
  </footer>

</main>

<script>

/* =========================
   基本信息
========================= */

const USER = "cheems201";
const REPO = "class-homework";
const FILE = "homework.jpg";

/*
 * 图片不再使用 jsDelivr
 * 直接从 GitHub Raw 获取
 */
const RAW_URL =
  "https://raw.githubusercontent.com/" +
  USER +
  "/" +
  REPO +
  "/main/" +
  FILE;


/* =========================
   加载作业图片
========================= */

function loadHomeworkImage() {

  const img = document.getElementById("homeworkImage");

  /*
   * 加时间参数，避免浏览器一直使用旧缓存
   */
  img.src = RAW_URL + "?v=" + Date.now();

}


/* =========================
   点击图片查看原图
========================= */

document
  .getElementById("homeworkImage")
  .addEventListener("click", function () {

    window.open(
      RAW_URL + "?v=" + Date.now(),
      "_blank"
    );

  });


/* =========================
   获取 homework.jpg 最近一次提交日期
========================= */

async function loadDate() {

  const dateElement = document.getElementById("date");

  const api =
    "https://api.github.com/repos/" +
    USER +
    "/" +
    REPO +
    "/commits?path=" +
    FILE +
    "&per_page=1";

  try {

    const response = await fetch(api, {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error(
        "GitHub API HTTP " + response.status
      );
    }

    const commits = await response.json();

    if (!commits.length) {
      throw new Error("没有找到作业图片的提交记录");
    }

    const commitDate =
      commits[0].commit.author.date;

    const date = new Date(commitDate);

    const year = date.getFullYear();
    const month = date.getMonth() + 1;
    const day = date.getDate();

    const weekdays = [
      "星期日",
      "星期一",
      "星期二",
      "星期三",
      "星期四",
      "星期五",
      "星期六"
    ];

    const weekday =
      weekdays[date.getDay()];

    dateElement.textContent =
      "作业日期：" +
      year +
      "年" +
      month +
      "月" +
      day +
      "日 " +
      weekday;

  } catch (error) {

    console.error(error);

    dateElement.textContent =
      "作业日期获取失败";

  }

}


/* =========================
   Aurora 滚动视差
========================= */

const aurora =
  document.getElementById("aurora");

window.addEventListener(
  "scroll",
  function () {

    const y =
      window.scrollY || 0;

    const moveY =
      Math.min(y * 0.12, 80);

    const moveX =
      Math.sin(y * 0.008) * 30;

    aurora.style.setProperty(
      "--move-y",
      moveY + "px"
    );

    aurora.style.setProperty(
      "--move-x",
      moveX + "px"
    );

  },
  {
    passive: true
  }
);


/* =========================
   启动
========================= */

loadHomeworkImage();
loadDate();

</script>

</body>
</html>
