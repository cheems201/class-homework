<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#080b18">

  <title>班级作业</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        sans-serif;

      color: white;

      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(99, 102, 241, 0.18),
          transparent 35%
        ),
        radial-gradient(
          circle at 85% 20%,
          rgba(6, 182, 212, 0.16),
          transparent 35%
        ),
        radial-gradient(
          circle at 50% 100%,
          rgba(168, 85, 247, 0.16),
          transparent 40%
        ),
        #070914;
    }

    /* =========================
       Aurora 光晕
       ========================= */

    .aurora {
      position: fixed;
      inset: -25%;
      pointer-events: none;
      z-index: -1;

      background:
        radial-gradient(
          ellipse 40% 30% at 20% 20%,
          rgba(99, 102, 241, 0.45),
          transparent 70%
        ),
        radial-gradient(
          ellipse 45% 35% at 80% 30%,
          rgba(6, 182, 212, 0.38),
          transparent 70%
        ),
        radial-gradient(
          ellipse 40% 35% at 50% 80%,
          rgba(168, 85, 247, 0.38),
          transparent 70%
        );

      filter: blur(70px);

      animation:
        auroraMove 18s ease-in-out infinite alternate;
    }

    @keyframes auroraMove {
      0% {
        transform: translate(-2%, -2%) scale(1);
      }

      50% {
        transform: translate(3%, -1%) scale(1.05);
      }

      100% {
        transform: translate(-1%, 3%) scale(1.02);
      }
    }

    /* =========================
       顶部
       ========================= */

    header {
      width: min(900px, calc(100% - 28px));
      margin: 28px auto 0;

      padding: 28px 20px;

      text-align: center;

      background: rgba(255, 255, 255, 0.055);

      border: 1px solid rgba(255, 255, 255, 0.12);

      border-radius: 26px;

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    header h1 {
      margin: 0;

      font-size: clamp(28px, 6vw, 42px);
      font-weight: 700;
      letter-spacing: -1px;

      background:
        linear-gradient(
          90deg,
          #ffffff,
          #b9c6ff,
          #8ee9ff
        );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    #date {
      margin-top: 10px;

      font-size: 14px;

      color: rgba(255, 255, 255, 0.62);
    }

    /* =========================
       主体
       ========================= */

    main {
      width: min(900px, calc(100% - 28px));

      margin: 20px auto 40px;
    }

    .card {
      padding: 14px;

      background: rgba(255, 255, 255, 0.065);

      border: 1px solid rgba(255, 255, 255, 0.13);

      border-radius: 26px;

      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);

      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.30),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);

      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-2px);

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.38),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    /* =========================
       作业图片
       ========================= */

    .image-wrapper {
      position: relative;

      overflow: hidden;

      border-radius: 18px;

      background: rgba(0, 0, 0, 0.18);
    }

    .homework {
      display: block;

      width: 100%;
      height: auto;

      border-radius: 18px;

      cursor: zoom-in;

      transition:
        transform 0.35s ease,
        filter 0.35s ease;
    }

    .image-wrapper:hover .homework {
      transform: scale(1.012);
      filter: brightness(1.04);
    }

    /* =========================
       底部提示
       ========================= */

    .hint {
      text-align: center;

      margin-top: 14px;

      font-size: 13px;

      color: rgba(255, 255, 255, 0.42);
    }

    /* =========================
       没有图片
       ========================= */

    .empty {
      text-align: center;

      padding: 70px 20px;

      color: rgba(255, 255, 255, 0.55);
    }

    .empty-icon {
      font-size: 42px;

      margin-bottom: 12px;
    }

    /* =========================
       手机优化
       ========================= */

    @media (max-width: 600px) {

      header {
        margin-top: 14px;
        padding: 24px 16px;

        border-radius: 22px;
      }

      main {
        margin-top: 14px;
      }

      .card {
        padding: 9px;

        border-radius: 22px;
      }

      .image-wrapper,
      .homework {
        border-radius: 16px;
      }

      .hint {
        margin-top: 11px;
      }
    }

    /* =========================
       减少动画
       ========================= */

    @media (prefers-reduced-motion: reduce) {

      .aurora {
        animation: none;
      }

      .card,
      .homework {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <!-- Aurora 背景 -->
  <div class="aurora"></div>

  <!-- 顶部 -->
  <header>

    <h1>📚 班级作业</h1>

    <div id="date">
      正在读取作业日期……
    </div>

  </header>

  <!-- 内容 -->
  <main>

    <div class="card">

      <div class="image-wrapper">

        <a href="homework.jpg" target="_blank">

          <img
            class="homework"
            src="homework.jpg"
            alt="最新作业"

            onerror="
              this.style.display='none';
              document.getElementById('empty').style.display='block';
            "
          >

        </a>

        <div
          id="empty"
          class="empty"
          style="display:none;"
        >

          <div class="empty-icon">📭</div>

          暂时还没有上传作业图片

        </div>

      </div>

      <div class="hint">
        点击图片查看原图
      </div>

    </div>

  </main>

  <script>

    /*
     * GitHub 信息
     */

    const owner = "cheems201";
    const repo = "class-homework";
    const file = "homework.jpg";


    /*
     * 自动获取 homework.jpg
     * 最近一次提交日期
     */

    async function getHomeworkDate() {

      try {

        const api =
          `https://api.github.com/repos/${owner}/${repo}/commits?path=${encodeURIComponent(file)}&per_page=1`;

        const response = await fetch(api);

        if (!response.ok) {
          throw new Error("GitHub API 请求失败");
        }

        const data = await response.json();

        if (!data.length) {

          document.getElementById("date").textContent =
            "暂时没有上传记录";

          return;
        }

        const date = new Date(
          data[0].commit.author.date
        );

        /*
         * GitHub 返回 UTC 时间
         * 转换成用户所在设备的本地时间
         */

        const year = date.getFullYear();

        const month =
          date.getMonth() + 1;

        const day =
          date.getDate();

        const weekdays = [
          "星期日",
          "星期一",
          "星期二",
          "星期三",
          "星期四",
          "星期五",
          "星期六"
        ];

        document.getElementById("date").textContent =
          `作业日期：${year}年${month}月${day}日 ${weekdays[date.getDay()]}`;

      } catch (error) {

        console.error(error);

        document.getElementById("date").textContent =
          "作业日期读取失败";

      }

    }

    getHomeworkDate();

  </script>

</body>
</html>
