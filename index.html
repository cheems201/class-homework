<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班级作业</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      color: #333;
    }

    header {
      background: white;
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    main {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 12px;
    }

    .card {
      background: white;
      padding: 12px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .homework {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 10px;
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      color: #888;
    }
  </style>
</head>

<body>

  <header>
    <h1>📚 班级作业</h1>
  </header>

  <main>
    <div class="card">
      <img
        class="homework"
        src="homework.jpg"
        alt="最新作业"
        onerror="this.style.display='none'; document.getElementById('empty').style.display='block';"
      >

      <div id="empty" class="empty" style="display:none;">
        暂时还没有上传作业图片
      </div>
    </div>
  </main>

</body>
</html>
